<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        /* Reset básico para emails */
        body { margin: 0; padding: 0; min-width: 100%; font-family: Arial, sans-serif; }
        table { border-spacing: 0; border-collapse: collapse; }
        td { padding: 0; }
        img { border: 0; }
        
        .container {
            width: 100%;
            max-width: 800px; /* Boa prática limitar largura */
            margin: 0 auto;
        }

        .header-bg {
            background-color: #C94040;
        }
        
        .content-bg {
            background-color: #f4f4f4;
        }

        .footer-bg {
            background-color: #000000;
        }
    </style>
</head>
<body style="background-color: #ffffff;">
    <table class="container" role="presentation" align="center" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td class="header-bg" style="padding: 32px 42px;">
                <table width="100%" border="0" cellspacing="0" cellpadding="0" style="table-layout: fixed;">
                    <tr>
                        <td align="left" valign="middle" width="50%" style="word-break: break-word; overflow-wrap: break-word;">
                            <h2 th:text="${subject}" style="margin: 0; color: black; font-size: 24px; font-family: Arial, sans-serif;">
                                Welcome to F20!
                            </h2>
                        </td>

                        <td align="right" valign="middle" width="50%">
                            <img th:src="'cid:logo'" 
                                alt="Logo" 
                                width="140" 
                                style="display: block; max-width: 100%; height: auto;" 
                            />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td class="content-bg" style="padding: 48px 42px; border-radius: 5px;">
                
                <table align="center" border="0" cellspacing="0" cellpadding="0">
                    <tr>
                        <td valign="middle" style="padding-right: 24px;">
                            <img th:src="'cid:icon'" alt="Icon" width="48" style="display: block;" />
                        </td>
                        <td valign="middle">
                            <h3 style="margin: 0; font-size: 18px; font-family: Arial, sans-serif;">
                                Hey, <span th:text="${username}">Username</span>
                            </h3>
                        </td>
                    </tr>
                </table>

                <div style="height: 20px;"></div>

                <p th:text="${messageBody}" style="font-family: Arial, sans-serif; font-size: 14px; color: #333333; margin: 0;">
                    Default message body.
                </p>

                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                    <tr th:if="${verificationCode != null}">
                        <td align="center" style="padding-top: 24px;">
                            
                            <table border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td align="center" style="background-color: #ffffff; padding: 15px 40px; border-radius: 8px; border: 1px solid #e0e0e0;">
                                        
                                        <h2 style="margin: 0; font-family: Arial, sans-serif; font-size: 28px; color: #C94040; letter-spacing: 4px;">
                                            <span th:text="${verificationCode}">123456</span>
                                        </h2>
                                        
                                    </td>
                                </tr>
                            </table>
                            
                        </td>
                    </tr>
                </table>

                <p th:if="${verificationCode != null}" style="text-align: center; width: 100%; margin-top: 10px; font-family: Arial, sans-serif; font-size: 12px; color: #555555;">
                    Expires in 30 minutes.
                </p>
            </td>
        </tr>

        <tr>
            <td class="footer-bg" style="padding: 32px 42px;">
                <table width="100%" border="0" cellspacing="0" cellpadding="0" style="table-layout: fixed;">
                    <tr>
                        <td align="left" valign="middle" width="50%" style="word-break: break-word; overflow-wrap: break-word;">
                            <h2 style="margin: 0; color: white; font-size: 14px; font-family: Arial, sans-serif;">
                                Thank you for your attention! <br> F20 Team.
                            </h2>
                        </td>

                        <td align="right" valign="middle" width="50%">
                            <img th:src="'cid:icon'" 
                                alt="footer_icon" 
                                width="48" 
                                style="display: block; max-width: 100%; height: auto;" 
                            />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
